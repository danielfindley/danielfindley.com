<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle Arena</title>
<style>
  :root {
    --bg: #121213; --bg2: #1a1a2e; --border: #3a3a3c;
    --green: #538d4e; --yellow: #b59f3b; --gray: #3a3a3c;
    --text: #ffffff; --text2: #818384;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh; overflow-x: auto;
  }

  /* --- Header --- */
  .header {
    text-align: center; padding: 24px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-size: 2.2em; letter-spacing: 6px; font-weight: 800;
    background: linear-gradient(135deg, #538d4e, #b59f3b, #ef5350, #ab47bc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p { color: var(--text2); margin-top: 4px; font-size: 0.95em; }

  /* --- Controls --- */
  .controls {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; padding: 14px; flex-wrap: wrap;
  }
  .controls button {
    background: var(--border); color: var(--text); border: none;
    padding: 8px 18px; border-radius: 6px; cursor: pointer;
    font-size: 0.95em; transition: background 0.2s;
  }
  .controls button:hover { background: #555; }
  .controls button.active { background: var(--green); }
  .game-label {
    font-size: 1.1em; font-weight: 600; min-width: 220px;
    text-align: center;
  }
  .game-label .target { color: var(--green); }
  .speed-control { display: flex; align-items: center; gap: 6px; }
  .speed-control input { width: 100px; accent-color: var(--green); }

  /* --- Arena grid --- */
  .arena {
    display: flex; justify-content: center; gap: 16px;
    padding: 16px; flex-wrap: wrap;
  }
  .solver-col {
    background: var(--bg2); border-radius: 12px; padding: 14px;
    min-width: 195px; border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center;
  }
  .solver-name {
    font-weight: 700; font-size: 1em; margin-bottom: 8px;
    padding: 4px 12px; border-radius: 4px; letter-spacing: 1px;
  }
  .board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .tile {
    width: 48px; height: 48px; display: flex; align-items: center;
    justify-content: center; font-size: 1.4em; font-weight: 700;
    border: 2px solid var(--border); text-transform: uppercase;
    border-radius: 4px; transition: transform 0.3s, background 0.3s, border-color 0.3s;
  }
  .tile.green  { background: var(--green);  border-color: var(--green); }
  .tile.yellow { background: var(--yellow); border-color: var(--yellow); }
  .tile.gray   { background: var(--gray);   border-color: var(--gray); }
  .tile.pop    { animation: pop 0.15s ease-out; }
  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .tile.flip {
    animation: flip 0.45s ease-in-out;
  }
  @keyframes flip {
    0%   { transform: rotateX(0deg); }
    45%  { transform: rotateX(90deg); }
    55%  { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }
  .solver-result {
    margin-top: 10px; font-size: 0.95em; font-weight: 600;
    min-height: 24px; text-align: center;
  }
  .solver-result.win  { color: var(--green); }
  .solver-result.fail { color: #ef5350; }

  /* --- Stats panel --- */
  .stats-panel {
    max-width: 1100px; margin: 20px auto; padding: 0 16px;
  }
  .stats-panel h2 {
    text-align: center; font-size: 1.3em; letter-spacing: 3px;
    margin-bottom: 16px; color: var(--text2);
  }
  .stats-grid {
    display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
  }
  .stat-card {
    background: var(--bg2); border-radius: 10px; padding: 16px 20px;
    min-width: 155px; border: 1px solid var(--border);
    text-align: center;
  }
  .stat-card .name { font-weight: 700; font-size: 0.9em; margin-bottom: 10px; letter-spacing: 1px; }
  .stat-card .big  { font-size: 2em; font-weight: 800; }
  .stat-card .label { font-size: 0.75em; color: var(--text2); margin-top: 2px; }
  .stat-card .row-stats { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
  .stat-card .mini { text-align: center; }
  .stat-card .mini .val { font-size: 1.1em; font-weight: 700; }
  .stat-card .mini .lbl { font-size: 0.65em; color: var(--text2); }

  /* --- Bar chart --- */
  .chart-section {
    max-width: 900px; margin: 24px auto; padding: 0 16px 40px;
  }
  .chart-section h2 {
    text-align: center; font-size: 1.3em; letter-spacing: 3px;
    margin-bottom: 16px; color: var(--text2);
  }
  .chart {
    background: var(--bg2); border-radius: 12px; padding: 24px;
    border: 1px solid var(--border);
  }
  .chart-bars {
    display: flex; align-items: flex-end; justify-content: center;
    gap: 24px; height: 180px; padding-bottom: 8px;
  }
  .bar-group { display: flex; flex-direction: column; align-items: center; }
  .bar {
    width: 44px; border-radius: 4px 4px 0 0; transition: height 0.8s ease;
    min-height: 4px;
  }
  .bar-val { font-size: 0.85em; font-weight: 700; margin-bottom: 4px; }
  .bar-label {
    font-size: 0.7em; color: var(--text2); margin-top: 6px;
    text-align: center; max-width: 70px; word-wrap: break-word;
  }

  /* --- Info panel (hidden by default) --- */
  .info-toggle {
    text-align: center; padding: 6px;
  }
  .info-toggle button {
    background: none; border: 1px solid var(--border); color: var(--text2);
    padding: 6px 16px; border-radius: 20px; cursor: pointer;
    font-size: 0.8em; transition: all 0.2s;
  }
  .info-toggle button:hover { color: var(--text); border-color: #555; }
  .info-panel {
    max-width: 1100px; margin: 0 auto; padding: 0 16px;
    max-height: 0; overflow: hidden; transition: max-height 0.4s ease;
  }
  .info-panel.open { max-height: 600px; }
  .info-grid {
    display: flex; justify-content: center; gap: 12px;
    padding: 12px 0 16px; flex-wrap: wrap;
  }
  .info-card {
    background: var(--bg2); border-radius: 8px; padding: 12px 14px;
    min-width: 160px; max-width: 180px; border: 1px solid var(--border);
    font-size: 0.78em; line-height: 1.45;
  }
  .info-card .info-name {
    font-weight: 700; margin-bottom: 6px; font-size: 0.95em;
    letter-spacing: 0.5px;
  }
  .info-card .info-type {
    display: inline-block; font-size: 0.7em; padding: 1px 6px;
    border-radius: 3px; margin-bottom: 6px; font-weight: 600;
  }
  .info-card .info-desc { color: var(--text2); }
</style>
</head>
<body>

<div class="header">
  <h1>WORDLE ARENA</h1>
  <p>LLM vs RL vs Heuristics</p>
</div>

<div class="controls">
  <button id="prevBtn" onclick="prevGame()">&#9664; Prev</button>
  <div class="game-label">
    Game <span id="gameNum">1</span> / <span id="totalGames">0</span>
    &mdash; <span id="targetWord" class="target">?????</span>
  </div>
  <button id="nextBtn" onclick="nextGame()">Next &#9654;</button>
  <button id="playBtn" class="active" onclick="togglePlay()">&#9654; Play</button>
  <div class="speed-control">
    <span style="font-size:0.8em;color:var(--text2)">Speed</span>
    <input type="range" id="speedSlider" min="1" max="10" value="5"
           oninput="updateSpeed()">
  </div>
</div>

<div class="info-toggle">
  <button onclick="toggleInfo()">&#9432; What are these algorithms?</button>
</div>
<div class="info-panel" id="infoPanel">
  <div class="info-grid" id="infoGrid"></div>
</div>

<div class="arena" id="arena"></div>

<div class="stats-panel">
  <h2>S T A T I S T I C S</h2>
  <div class="stats-grid" id="statsGrid"></div>
</div>

<div class="chart-section">
  <h2>A V G &nbsp; S C O R E</h2>
  <div class="chart">
    <div class="chart-bars" id="chartBars"></div>
  </div>
</div>

const SOLVERS   = ["Random", "Frequency", "REINFORCE", "A2C", "PPO", "Qwen 3.5 2B"];
const COLORS    = {"Random": "#818384", "Frequency": "#4fc3f7", "REINFORCE": "#66bb6a", "A2C": "#ef5350", "PPO": "#ffa726", "Qwen 3.5 2B": "#ab47bc"};
const DESCS     = {"Random": "Baseline \u2014 picks a random word from the remaining valid candidates. No strategy at all.", "Frequency": "Heuristic \u2014 scores words by how common their letters are among remaining candidates. No learning.", "REINFORCE": "RL \u2014 vanilla policy gradient. Collects full episodes, then nudges the policy toward actions that led to better outcomes. Simple but high variance.", "A2C": "RL \u2014 Advantage Actor-Critic. Actor picks words, Critic estimates position value. Updates every step using TD advantage, lower variance than REINFORCE.", "PPO": "RL \u2014 Proximal Policy Optimization. Like REINFORCE but collects batches and does multiple update passes with a clipped objective to prevent destructive updates.", "Qwen 3.5 2B": "LLM \u2014 Qwen 3.5 (2B params) running locally via Ollama. Prompted with game state and constraints, asked to guess a word. No Wordle-specific training."};
const NUM_GAMES = 50;

// ---- State ----
let currentGame = 0;
let currentRow  = -1;
let isPlaying   = true;
let speed       = 800;   // ms between row reveals
let animTimer   = null;

// ---- Build DOM ----
function init() {
  document.getElementById('totalGames').textContent = NUM_GAMES;
  buildInfoPanel();
  buildArena();
  buildStats();
  buildChart();
  showGame(0);
  scheduleTick();
}

function buildInfoPanel() {
  const grid = document.getElementById('infoGrid');
  const types = { 'Random':'BASELINE','Frequency':'HEURISTIC',
    'REINFORCE':'RL','A2C':'RL','PPO':'RL','Qwen 3.5 2B':'LLM' };
  const typeBg = { 'BASELINE':'#3a3a3c','HEURISTIC':'#4fc3f7','RL':'#ffa726','LLM':'#ab47bc' };
  for (const name of SOLVERS) {
    const t = types[name] || 'OTHER';
    const card = document.createElement('div');
    card.className = 'info-card';
    card.innerHTML = `
      <div class="info-name" style="color:${COLORS[name]}">${name}</div>
      <span class="info-type" style="background:${typeBg[t] || '#555'}">${t}</span>
      <div class="info-desc">${DESCS[name] || ''}</div>`;
    grid.appendChild(card);
  }
}

function toggleInfo() {
  document.getElementById('infoPanel').classList.toggle('open');
}

function buildArena() {
  const arena = document.getElementById('arena');
  arena.innerHTML = '';
  for (const name of SOLVERS) {
    const col = document.createElement('div');
    col.className = 'solver-col';

    const label = document.createElement('div');
    label.className = 'solver-name';
    label.style.color = COLORS[name];
    label.style.borderBottom = '2px solid ' + COLORS[name];
    label.textContent = name;
    col.appendChild(label);

    const board = document.createElement('div');
    board.className = 'board';
    board.id = 'board-' + safeName(name);
    for (let r = 0; r < 6; r++) {
      const row = document.createElement('div');
      row.className = 'row';
      for (let c = 0; c < 5; c++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = `t-${safeName(name)}-${r}-${c}`;
        row.appendChild(tile);
      }
      board.appendChild(row);
    }
    col.appendChild(board);

    const result = document.createElement('div');
    result.className = 'solver-result';
    result.id = 'res-' + safeName(name);
    col.appendChild(result);

    arena.appendChild(col);
  }
}

function buildStats() {
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = '';
  for (const name of SOLVERS) {
    const s = DATA[name].stats;
    const card = document.createElement('div');
    card.className = 'stat-card';
    card.innerHTML = `
      <div class="name" style="color:${COLORS[name]}">${name}</div>
      <div class="big">${(s.win_rate * 100).toFixed(0)}%</div>
      <div class="label">WIN RATE</div>
      <div class="row-stats">
        <div class="mini"><div class="val">${s.avg_score}</div><div class="lbl">AVG</div></div>
        <div class="mini"><div class="val">${s.wins}/${s.total}</div><div class="lbl">W/L</div></div>
      </div>`;
    grid.appendChild(card);
  }
}

function buildChart() {
  const container = document.getElementById('chartBars');
  container.innerHTML = '';
  const maxAvg = Math.max(...SOLVERS.map(n => DATA[n].stats.avg_score), 1);
  for (const name of SOLVERS) {
    const avg = DATA[name].stats.avg_score;
    const pct = Math.max(5, (avg / 7) * 100);
    const group = document.createElement('div');
    group.className = 'bar-group';
    group.innerHTML = `
      <div class="bar-val" style="color:${COLORS[name]}">${avg}</div>
      <div class="bar" style="height:${pct}%;background:${COLORS[name]}"></div>
      <div class="bar-label">${name}</div>`;
    container.appendChild(group);
  }
}

// ---- Game display ----
function showGame(idx) {
  currentGame = idx;
  currentRow = -1;
  document.getElementById('gameNum').textContent = idx + 1;

  const target = DATA[SOLVERS[0]].games[idx].target;
  document.getElementById('targetWord').textContent = '?????';

  // Clear all boards
  for (const name of SOLVERS) {
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 5; c++) {
        const tile = document.getElementById(`t-${safeName(name)}-${r}-${c}`);
        tile.textContent = '';
        tile.className = 'tile';
      }
    }
    document.getElementById('res-' + safeName(name)).textContent = '';
    document.getElementById('res-' + safeName(name)).className = 'solver-result';
  }
}

function revealRow(rowIdx) {
  for (const name of SOLVERS) {
    const game = DATA[name].games[currentGame];
    if (rowIdx >= game.guesses.length) continue;
    const guess = game.guesses[rowIdx];
    const feedback = game.feedbacks[rowIdx];

    for (let c = 0; c < 5; c++) {
      const tile = document.getElementById(`t-${safeName(name)}-${rowIdx}-${c}`);
      // Show letter immediately
      tile.textContent = guess[c].toUpperCase();
      tile.classList.add('pop');

      // Delayed color reveal with flip
      (function(t, fb, delay) {
        setTimeout(() => {
          t.classList.remove('pop');
          t.classList.add('flip');
          setTimeout(() => { t.classList.add(fb); }, 200);
        }, delay);
      })(tile, feedback[c], c * 120);
    }

    // Show result after last guess
    if (rowIdx === game.guesses.length - 1) {
      setTimeout(() => {
        const res = document.getElementById('res-' + safeName(name));
        if (game.solved) {
          res.textContent = `Solved ${game.score}/6`;
          res.className = 'solver-result win';
        } else {
          res.textContent = 'FAIL';
          res.className = 'solver-result fail';
        }
      }, 5 * 120 + 400);
    }
  }
}

function revealTarget() {
  const target = DATA[SOLVERS[0]].games[currentGame].target;
  document.getElementById('targetWord').textContent = target.toUpperCase();
}

// ---- Animation loop ----
function tick() {
  if (!isPlaying) return;

  const maxRows = Math.max(...SOLVERS.map(n => DATA[n].games[currentGame].guesses.length));

  if (currentRow < maxRows - 1) {
    currentRow++;
    revealRow(currentRow);
    scheduleTick();
  } else {
    // All rows revealed — show target and pause before next game
    revealTarget();
    setTimeout(() => {
      if (!isPlaying) return;
      const next = (currentGame + 1) % NUM_GAMES;
      showGame(next);
      scheduleTick();
    }, speed * 2.5);
  }
}

function scheduleTick() {
  clearTimeout(animTimer);
  animTimer = setTimeout(tick, speed);
}

// ---- Controls ----
function togglePlay() {
  isPlaying = !isPlaying;
  const btn = document.getElementById('playBtn');
  btn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
  btn.classList.toggle('active', isPlaying);
  if (isPlaying) scheduleTick();
}

function prevGame() {
  const idx = (currentGame - 1 + NUM_GAMES) % NUM_GAMES;
  showGame(idx);
  // Instantly reveal all rows
  revealAllRows();
}

function nextGame() {
  const idx = (currentGame + 1) % NUM_GAMES;
  showGame(idx);
  revealAllRows();
}

function revealAllRows() {
  const maxRows = Math.max(...SOLVERS.map(n => DATA[n].games[currentGame].guesses.length));
  for (let r = 0; r < maxRows; r++) {
    for (const name of SOLVERS) {
      const game = DATA[name].games[currentGame];
      if (r >= game.guesses.length) continue;
      const guess = game.guesses[r];
      const feedback = game.feedbacks[r];
      for (let c = 0; c < 5; c++) {
        const tile = document.getElementById(`t-${safeName(name)}-${r}-${c}`);
        tile.textContent = guess[c].toUpperCase();
        tile.classList.add(feedback[c]);
      }
      if (r === game.guesses.length - 1) {
        const res = document.getElementById('res-' + safeName(name));
        if (game.solved) {
          res.textContent = `Solved ${game.score}/6`;
          res.className = 'solver-result win';
        } else {
          res.textContent = 'FAIL';
          res.className = 'solver-result fail';
        }
      }
    }
  }
  currentRow = maxRows - 1;
  revealTarget();
}

function updateSpeed() {
  const val = document.getElementById('speedSlider').value;
  speed = 1600 - val * 140;  // slider 1=slow(1460ms) 10=fast(200ms)
}

function safeName(name) {
  return name.replace(/[^a-zA-Z0-9]/g, '_');
}

// ---- Boot ----
init();
</script>
